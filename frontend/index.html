<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAF9" />
    <meta name="description" content="Pulsecheck Support — a human-centered demo of multi-agent customer support." />
    <link rel="icon" type="image/svg+xml" href="/pulsecheck-mark.svg" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('pulsecheck-theme') || 'light';
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const dark = saved === 'dark' || (saved === 'system' && prefersDark);
          document.documentElement.classList.toggle('dark', dark);
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#1C1917' : '#FAFAF9');
        } catch (_) {
          document.documentElement.classList.remove('dark');
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#FAFAF9');
        }
      })();
    </script>
    <title>Pulsecheck Support</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
