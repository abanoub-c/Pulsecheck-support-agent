services:
  - type: web
    name: pulsecheck-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PULSECHECK_DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: PULSECHECK_ENABLE_ADMIN
        value: "1"
      - key: INTERNAL_API_KEY
        generateValue: true

  - type: web
    name: pulsecheck-bff
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /_app/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MOCK_API
        value: "false"
      - key: AGENT_API_URL
        fromService:
          name: pulsecheck-agent
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: INTERNAL_API_KEY
        fromService:
          name: pulsecheck-agent
          type: web
          envVarKey: INTERNAL_API_KEY
      - key: CORS_ORIGINS
        sync: false
